# El plan gratuito de Render duerme la API tras 15 minutos sin tráfico.
# Este ping la mantiene despierta. Requiere la variable de repositorio API_URL
# (Settings -> Secrets and variables -> Actions -> Variables).
# Nota: GitHub pausa los workflows programados tras 60 días sin commits en el repo.
name: Keep-alive de la API

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "${{ vars.API_URL }}/health"
